<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche outil — Boîte à outils</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --papier:#FAF8F2;
    --carreau:#F4F1E9;
    --reglure:#E9E5DA;
    --encre:#201E19;
    --texte:#4F4A41;
    --gris:#6E6759;
    --gris-clair:#8A8377;
    --plan:#2B4C7E;
    --plan-clair:#E4EAF3;
    --creme:#F2EFE6;
    --display:'Fraunces',Georgia,serif;
    --corps:'Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono','IBM Plex Mono',monospace;
    --marge:clamp(1.25rem,5vw,4rem);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;color:var(--encre);font-family:var(--corps);
    font-size:16px;line-height:1.68;-webkit-font-smoothing:antialiased;
    background-color:var(--papier);
    background-image:
      linear-gradient(var(--carreau) 1px,transparent 1px),
      linear-gradient(90deg,var(--carreau) 1px,transparent 1px),
      linear-gradient(var(--reglure) 1px,transparent 1px),
      linear-gradient(90deg,var(--reglure) 1px,transparent 1px);
    background-size:12px 12px,12px 12px,60px 60px,60px 60px;
  }
  .enveloppe{max-width:46rem;margin:0 auto;padding:0 var(--marge)}

  .retour{padding:1.5rem 0}
  .retour a{
    font-family:var(--mono);font-size:.73rem;letter-spacing:.04em;
    color:var(--gris);text-decoration:none;
    display:inline-flex;align-items:center;gap:.45rem;
  }
  .retour a:hover{color:var(--encre)}
  .retour a:focus-visible{outline:2px solid var(--plan);outline-offset:3px}

  .chapeau{padding:1rem 0 2rem;border-top:1px solid var(--reglure)}
  .surtitre{
    font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--gris);
    margin:1.5rem 0 .9rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;
  }
  .sep{color:#B3AC9E}
  .badge{display:inline-block;padding:.12rem .45rem;font-size:.68rem;letter-spacing:.05em}
  .badge.en-ligne,.badge.en-test{background:var(--plan-clair);color:var(--plan)}
  .badge.a-venir{background:var(--creme);color:#7D7669}

  .chapeau h1{
    font-family:var(--display);font-weight:600;
    font-size:clamp(1.9rem,5vw,2.7rem);line-height:1.14;
    letter-spacing:-.02em;margin:0 0 1rem;
  }
  .chapeau .accroche{font-size:1.04rem;color:var(--texte);margin:0 0 1.75rem;max-width:58ch}

  .bouton{
    display:inline-block;background:var(--plan);color:var(--papier);
    font-family:var(--mono);font-size:.8rem;letter-spacing:.03em;
    text-decoration:none;padding:.65rem 1.3rem;border-radius:0;
    transition:background .15s;
  }
  .bouton:hover{background:#22406C}
  .bouton:focus-visible{outline:2px solid var(--encre);outline-offset:2px}

  .article{border-top:1px solid var(--reglure);padding:2.25rem 0 2.5rem}
  .article h2{
    font-family:var(--display);font-weight:600;font-size:1.42rem;
    line-height:1.25;letter-spacing:-.01em;margin:2.5rem 0 .85rem;
  }
  .article h2:first-child{margin-top:0}
  .article h3{
    font-family:var(--mono);font-weight:500;font-size:.94rem;
    letter-spacing:-.01em;margin:2rem 0 .6rem;color:var(--plan);
  }
  .article p{margin:0 0 1.1rem;color:var(--texte)}
  .article ul,.article ol{margin:0 0 1.1rem;padding-left:1.3rem;color:var(--texte)}
  .article li{margin-bottom:.35rem}
  .article a{color:var(--plan)}
  .article strong{font-weight:600;color:var(--encre)}
  .article code{
    font-family:var(--mono);font-size:.86em;
    background:var(--creme);padding:.1rem .3rem;
  }
  .article hr{border:none;border-top:1px solid var(--reglure);margin:2.25rem 0}
  .article blockquote{
    margin:1.4rem 0;padding-left:1rem;
    border-left:2px solid var(--plan);color:var(--gris);
  }
  .article figure{margin:1.9rem 0}
  .article img{
    width:100%;height:auto;display:block;
    border:1px solid var(--reglure);border-radius:0;background:var(--creme);
  }
  .article figcaption{
    font-family:var(--mono);font-size:.71rem;color:var(--gris);
    margin-top:.55rem;line-height:1.55;
  }

  .pied{border-top:1px solid var(--reglure);padding:2rem 0 4rem}
  .pied .rappel{
    font-family:var(--mono);font-size:.72rem;color:var(--gris);margin:0 0 1.1rem;
  }
  .vide{padding:2.5rem 0;color:var(--gris)}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<nav class="retour enveloppe" aria-label="Navigation">
  <a href="index.html"><span aria-hidden="true">&larr;</span> cd ..</a>
</nav>

<header class="chapeau enveloppe">
  <p class="surtitre" id="surtitre"></p>
  <h1 id="titre">&nbsp;</h1>
  <p class="accroche" id="accroche"></p>
  <a class="bouton" id="lien-haut" href="#" hidden>Ouvrir l'outil</a>
</header>

<main class="article enveloppe" id="article">
  <p class="vide">Chargement…</p>
</main>

<footer class="pied enveloppe">
  <p class="rappel" id="rappel"></p>
  <a class="bouton" id="lien-bas" href="#" hidden>Ouvrir l'outil</a>
</footer>

<script>
const LIBELLES = {"en-ligne":"En ligne","en-test":"En test","a-venir":"À venir"};

function echapper(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function markdown(src, base){
  const abs = u => /^(https?:)?\/\//.test(u) ? u : base + u;
  const enligne = t => echapper(t)
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,a,u)=>`<img src="${abs(u)}" alt="${a}">`)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2">$1</a>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');

  let html = "";
  for(let bloc of src.replace(/\r\n/g,"\n").split(/\n{2,}/)){
    bloc = bloc.trim();
    if(!bloc) continue;
    if(/^---+$/.test(bloc)){ html += "<hr>"; continue; }
    if(/^###\s+/.test(bloc)){ html += `<h3>${enligne(bloc.replace(/^###\s+/,""))}</h3>`; continue; }
    if(/^##\s+/.test(bloc)){  html += `<h2>${enligne(bloc.replace(/^##\s+/,""))}</h2>`;  continue; }
    if(/^#\s+/.test(bloc)){   html += `<h2>${enligne(bloc.replace(/^#\s+/,""))}</h2>`;   continue; }

    const lignes = bloc.split("\n");
    const img = lignes[0].match(/^!\[([^\]]*)\]\(([^)\s]+)\)\s*$/);
    if(img){
      const leg = lignes[1] && /^\*.+\*$/.test(lignes[1].trim())
        ? lignes[1].trim().replace(/^\*|\*$/g,"") : null;
      html += `<figure><img src="${echapper(abs(img[2]))}" alt="${echapper(img[1])}">`
            + (leg ? `<figcaption>${enligne(leg)}</figcaption>` : "") + `</figure>`;
      continue;
    }
    if(/^>\s?/.test(bloc)){
      html += `<blockquote><p>${enligne(bloc.replace(/^>\s?/gm,""))}</p></blockquote>`; continue;
    }
    if(/^[-*+]\s+/.test(bloc)){
      html += "<ul>" + lignes.map(l=>`<li>${enligne(l.replace(/^[-*+]\s+/,""))}</li>`).join("") + "</ul>"; continue;
    }
    if(/^\d+[.)]\s+/.test(bloc)){
      html += "<ol>" + lignes.map(l=>`<li>${enligne(l.replace(/^\d+[.)]\s+/,""))}</li>`).join("") + "</ol>"; continue;
    }
    html += `<p>${enligne(bloc).replace(/\n/g,"<br>")}</p>`;
  }
  return html;
}

function erreur(msg){
  document.getElementById("titre").textContent = "Fiche introuvable";
  document.getElementById("article").innerHTML = `<p class="vide">${echapper(msg)}</p>`;
}

const dossier = new URLSearchParams(location.search).get("outil");

if(!dossier){
  erreur("Aucun outil demandé. Revenez à la liste des outils.");
} else {
  const base = dossier + "/";
  fetch("outils.json?v=" + Date.now())
    .then(r => r.json())
    .then(d => {
      const o = (d.outils || []).find(x => x.dossier === dossier);
      if(!o) throw new Error("inconnu");

      document.title = o.titre + " — Boîte à outils";
      document.getElementById("titre").textContent = o.titre;
      document.getElementById("accroche").textContent = o.description || "";

      const statut = o.statut || "en-ligne";
      document.getElementById("surtitre").innerHTML =
        (o.categorie ? echapper(o.categorie) + ' <span class="sep">·</span> ' : "") +
        `<span class="badge ${echapper(statut)}">${echapper(LIBELLES[statut]||statut)}</span>`;

      if(statut !== "a-venir"){
        ["lien-haut","lien-bas"].forEach(k=>{
          const a = document.getElementById(k);
          a.href = o.url || (base + "index.html");
          a.hidden = false;
        });
      }
      if(o.usage) document.getElementById("rappel").textContent = o.usage;

      return fetch(base + "fiche.md?v=" + Date.now());
    })
    .then(r => { if(!r.ok) throw new Error("md"); return r.text(); })
    .then(txt => { document.getElementById("article").innerHTML = markdown(txt, base); })
    .catch(e => {
      if(e.message === "inconnu"){
        erreur("Cet outil ne figure pas dans la liste.");
      } else {
        document.getElementById("article").innerHTML =
          `<p class="vide">Le texte de présentation n'a pas pu être chargé.
           Vérifiez que <code>${echapper(dossier)}/fiche.md</code> existe.</p>`;
      }
    });
}
</script>
</body>
</html>
