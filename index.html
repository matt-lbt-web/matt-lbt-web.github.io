<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boîte à outils — Matthias Lombart</title>
<meta name="description" content="Outils en ligne pour le pilotage et la gestion en établissement.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --papier:#FAF8F2;
    --carreau:#F4F1E9;
    --reglure:#E9E5DA;
    --encre:#201E19;
    --texte:#4F4A41;
    --gris:#6E6759;
    --gris-clair:#8A8377;
    --gouttiere:#B3AC9E;
    --plan:#2B4C7E;
    --plan-clair:#E4EAF3;
    --creme:#F2EFE6;

    --display:'Fraunces',Georgia,serif;
    --corps:'Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono','IBM Plex Mono',monospace;

    --marge:clamp(1.25rem,5vw,4rem);
  }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}

  body{
    margin:0;
    color:var(--encre);
    font-family:var(--corps);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    background-color:var(--papier);
    background-image:
      linear-gradient(var(--carreau) 1px,transparent 1px),
      linear-gradient(90deg,var(--carreau) 1px,transparent 1px),
      linear-gradient(var(--reglure) 1px,transparent 1px),
      linear-gradient(90deg,var(--reglure) 1px,transparent 1px);
    background-size:12px 12px,12px 12px,60px 60px,60px 60px;
    background-position:0 0;
  }

  .enveloppe{max-width:64rem;margin:0 auto;padding:0 var(--marge)}

  /* ---------- En-tête ---------- */
  .bandeau{padding:clamp(2.5rem,7vw,4.5rem) 0 clamp(1.5rem,4vw,2.5rem)}

  .bandeau h1{
    font-family:var(--mono);
    font-weight:500;
    font-size:clamp(1.9rem,5.5vw,2.9rem);
    line-height:1.15;
    letter-spacing:-.03em;
    margin:0 0 .75rem;
  }
  .curseur{
    color:var(--plan);
    animation:clignote 1.15s step-end infinite;
  }
  @keyframes clignote{50%{opacity:0}}

  .bandeau .intro{
    max-width:50ch;
    color:var(--texte);
    font-size:1.02rem;
    margin:0 0 1.75rem;
  }

  /* ---------- Bloc auteur.cfg ---------- */
  .config{
    border:1px solid #E3DED1;
    background:rgba(250,248,242,.88);
    border-radius:2px;
    overflow:hidden;
    max-width:46rem;
    margin:0 0 2rem;
  }
  .config-titre{
    background:var(--creme);
    border-bottom:1px solid #E3DED1;
    padding:.4rem .8rem;
    font-family:var(--mono);
    font-size:.7rem;
    color:var(--gris-clair);
    letter-spacing:.06em;
  }
  .config-corps{
    padding:.7rem .8rem;
    font-family:var(--mono);
    font-size:.76rem;
    line-height:1.85;
    color:var(--gris);
    overflow-wrap:anywhere;
  }
  .cle{color:var(--plan)}
  .val{color:var(--encre)}
  .commentaire{color:#A8A193}

  /* ---------- Filtres ---------- */
  .filtres{
    display:flex;flex-wrap:wrap;gap:.4rem;
    padding-bottom:1.1rem;
    border-bottom:1px solid var(--reglure);
  }
  .filtre{
    font-family:var(--mono);font-size:.73rem;letter-spacing:.03em;
    color:var(--gris);background:rgba(250,248,242,.8);
    border:1px solid var(--reglure);border-radius:0;
    padding:.35rem .75rem;cursor:pointer;
    transition:border-color .15s,color .15s,background .15s;
  }
  .filtre:hover{border-color:var(--gris-clair);color:var(--encre)}
  .filtre[aria-pressed="true"]{
    background:var(--encre);border-color:var(--encre);color:var(--papier);
  }
  .filtre:focus-visible{outline:2px solid var(--plan);outline-offset:2px}

  /* ---------- Liste ---------- */
  .liste{list-style:none;margin:0;padding:0}
  .outil{border-bottom:1px solid var(--reglure)}

  .outil a.bloc{
    display:grid;grid-template-columns:1fr;gap:1rem;
    padding:1.75rem 0;text-decoration:none;color:inherit;
    transition:background .18s;
  }
  .outil a.bloc:hover{
    background:linear-gradient(90deg,rgba(43,76,126,.05),transparent 72%);
  }
  .outil a.bloc:focus-visible{outline:2px solid var(--plan);outline-offset:-2px}

  @media(min-width:52rem){
    .outil a.bloc{grid-template-columns:14rem 1fr;gap:2rem;align-items:start}
  }

  .vignette,.sans-vignette{
    width:100%;aspect-ratio:16/10;
    border:1px solid var(--reglure);border-radius:0;
    background:var(--creme);display:block;
  }
  .vignette{object-fit:cover;object-position:top left}
  .sans-vignette{
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:.68rem;color:#9C9587;
    letter-spacing:.08em;
  }

  .contenu .meta{
    font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;
    color:var(--gris);display:flex;flex-wrap:wrap;align-items:center;
    gap:.5rem;margin:0 0 .5rem;text-transform:uppercase;
  }
  .sep{color:var(--gouttiere)}
  .badge{display:inline-block;padding:.12rem .45rem;font-size:.68rem;letter-spacing:.05em}
  .badge.en-ligne{background:var(--plan-clair);color:var(--plan)}
  .badge.en-test{background:var(--plan-clair);color:var(--plan)}
  .badge.a-venir{background:var(--creme);color:#7D7669}

  .contenu h2{
    font-family:var(--display);font-weight:600;font-size:1.32rem;
    line-height:1.25;letter-spacing:-.01em;margin:0 0 .4rem;
    display:flex;align-items:baseline;gap:.5rem;
  }
  .fleche{font-size:.9rem;color:var(--plan);transition:transform .18s;flex-shrink:0}
  .outil a.bloc:hover .fleche{transform:translateX(4px)}

  .contenu p{margin:0 0 .5rem;max-width:64ch;color:var(--texte);font-size:.94rem}
  .contenu .usage{font-size:.86rem;color:#7D7669;font-style:italic;margin:0}

  /* ---------- Pied ---------- */
  .pied{
    padding:2.5rem 0 4rem;font-family:var(--mono);font-size:.72rem;
    color:var(--gris);display:flex;flex-wrap:wrap;
    justify-content:space-between;gap:1rem;
  }
  .vide{padding:2.5rem 0;color:var(--gris);font-size:.94rem}

  @media(prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<header class="bandeau enveloppe">
  <h1>boîte-à-outils<span class="curseur" aria-hidden="true">▊</span></h1>
  <p class="intro" id="intro"></p>

  <div class="config">
    <div class="config-titre">auteur.cfg</div>
    <div class="config-corps" id="config"></div>
  </div>
</header>

<nav class="enveloppe" aria-label="Filtrer par domaine">
  <div class="filtres" id="filtres"></div>
</nav>

<main class="enveloppe">
  <ul class="liste" id="liste"></ul>
  <p class="vide" id="vide" hidden>Aucun outil dans ce domaine pour le moment.</p>
</main>

<footer class="pied enveloppe">
  <span id="compteur"></span>
  <span>Mise à jour&nbsp;: <span id="maj"></span></span>
</footer>

<script>
const LIBELLES = {"en-ligne":"En ligne","en-test":"En test","a-venir":"À venir"};

let donnees = null;
let filtreActif = "tous";

function echapper(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function formaterDate(iso){
  if(!iso) return "";
  const [a,m] = iso.split("-");
  const mois = ["janv.","févr.","mars","avr.","mai","juin",
                "juil.","août","sept.","oct.","nov.","déc."];
  return m ? `${mois[parseInt(m,10)-1]} ${a}` : a;
}

function destination(o){
  if(o.statut === "a-venir") return null;
  return o.dossier ? `fiche.html?outil=${encodeURIComponent(o.dossier)}` : (o.url || null);
}

function rendreEntete(){
  const p = donnees.profil || {};
  if(p.intro) document.getElementById("intro").textContent = p.intro;
  const l = [];
  if(p.nom)           l.push(`<span class="cle">nom</span> = <span class="val">"${echapper(p.nom)}"</span>`);
  if(p.fonction)      l.push(`<span class="cle">fonction</span> = "${echapper(p.fonction)}"`);
  if(p.etablissement) l.push(`<span class="cle">etablissement</span> = "${echapper(p.etablissement)}"`);
  if(p.note)          l.push(`<span class="commentaire"># ${echapper(p.note)}</span>`);
  document.getElementById("config").innerHTML = l.map(x=>`<div>${x}</div>`).join("");
}

function rendreFiltres(){
  const cats = [...new Set(donnees.outils.map(o=>o.categorie).filter(Boolean))].sort();
  const box = document.getElementById("filtres");
  box.innerHTML = "";
  [["tous","Tous"], ...cats.map(c=>[c,c])].forEach(([val,lib])=>{
    const b = document.createElement("button");
    b.className = "filtre"; b.type = "button"; b.textContent = lib;
    b.setAttribute("aria-pressed", String(val === filtreActif));
    b.addEventListener("click", ()=>{ filtreActif = val; rendreFiltres(); rendreListe(); });
    box.appendChild(b);
  });
}

function rendreListe(){
  const visibles = donnees.outils
    .filter(o => filtreActif === "tous" || o.categorie === filtreActif)
    .sort((a,b) => (b.date||"").localeCompare(a.date||""));

  const total = visibles.length;

  document.getElementById("liste").innerHTML = visibles.map((o,i)=>{
    const statut = o.statut || "en-ligne";
    const num = String(i+1).padStart(2,"0") + " / " + String(total).padStart(2,"0");
    const src = o.vignette && o.dossier ? `${o.dossier}/${o.vignette}` : o.vignette;
    const visuel = src
      ? `<img class="vignette" src="${echapper(src)}" alt="" loading="lazy">`
      : `<div class="sans-vignette" aria-hidden="true">aperçu</div>`;

    const corps = `
      ${visuel}
      <div class="contenu">
        <p class="meta">
          <span>${num}</span><span class="sep">·</span>
          <span>${echapper(o.categorie||"")}</span><span class="sep">·</span>
          <span class="badge ${echapper(statut)}">${echapper(LIBELLES[statut]||statut)}</span>
        </p>
        <h2>${echapper(o.titre)}${destination(o)?' <span class="fleche" aria-hidden="true">&rarr;</span>':''}</h2>
        <p>${echapper(o.description||"")}</p>
        ${o.usage ? `<p class="usage">${echapper(o.usage)}</p>` : ""}
      </div>`;

    const cible = destination(o);
    return `<li class="outil">` +
      (cible ? `<a class="bloc" href="${echapper(cible)}">${corps}</a>`
             : `<div class="bloc">${corps}</div>`) +
      `</li>`;
  }).join("");

  document.getElementById("vide").hidden = visibles.length > 0;

  const n = donnees.outils.length;
  document.getElementById("compteur").textContent =
    n + (n > 1 ? " outils référencés" : " outil référencé");
  document.getElementById("maj").textContent =
    formaterDate(donnees.outils.map(o=>o.date).filter(Boolean).sort().pop());
}

fetch("outils.json?v=" + Date.now())
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { donnees = d; rendreEntete(); rendreFiltres(); rendreListe(); })
  .catch(() => {
    document.getElementById("liste").innerHTML =
      `<li class="vide">La liste des outils n'a pas pu être chargée.
       Vérifiez que <code>outils.json</code> est présent à la racine
       et que sa syntaxe est valide.</li>`;
  });
</script>
</body>
</html>
